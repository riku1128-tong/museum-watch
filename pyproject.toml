[project]
name = "museum-watch"
version = "0.1.0"
description = "東京都・神奈川県の美術館の開館状況と展示を毎週集めてローカルHTMLにまとめる"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "jpholiday>=0.1.10",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
