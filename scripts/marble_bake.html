<!doctype html>
<!--
  背景の大理石テクスチャを生成する作業用ページ（公開ページには含めない）。
  SVG フィルタのまま CSS 背景に使うと描画が重いので、ブラウザで一度だけ JPEG に焼き付けて docs/ に置く。
  使い方: `python scripts/marble_upload.py` を起動し、このページをブラウザで開いて「保存」を押す。
-->
<meta charset="utf-8">
<title>marble bake</title>
<style>body{margin:0;font:14px sans-serif}canvas{width:49%;border:1px solid #999}</style>
<button id="save">docs/ に保存</button> <span id="msg"></span><br>
<canvas id="light"></canvas><canvas id="dark"></canvas>
<script>
const W = 2400, H = 1500;
function grad(id, x2, y2, lo, hi, color) {
  return `<linearGradient id='${id}' gradientUnits='userSpaceOnUse' x1='0' y1='0' x2='${x2}' y2='${y2}' spreadMethod='repeat'>
    <stop offset='0' stop-color='${color}' stop-opacity='0'/><stop offset='${lo}' stop-color='${color}' stop-opacity='0'/>
    <stop offset='.5' stop-color='${color}' stop-opacity='1'/><stop offset='${hi}' stop-color='${color}' stop-opacity='0'/>
    <stop offset='1' stop-color='${color}' stop-opacity='0'/></linearGradient>`;
}
// 斜めの細い縞をノイズで揺らして大理石の筋を作る（main = 太い筋、fine = 細い筋、halo = 筋のにじみ）
function marble({ bg, vein, main, fine, halo, cloud, cloudOp }) {
  const disp = `<feTurbulence type='fractalNoise' baseFrequency='0.0019' numOctaves='5' seed='5' result='t'/>
    <feDisplacementMap in='SourceGraphic' in2='t' scale='390' xChannelSelector='R' yChannelSelector='G'/>`;
  const full = `x='-300' y='-300' width='${W + 600}' height='${H + 600}'`;
  return `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'><defs>
    ${grad("a", 630, 390, ".485", ".515", vein)}${grad("h", 630, 390, ".38", ".62", vein)}${grad("b", 285, -180, ".494", ".506", vein)}
    <filter id='w' x='-10%' y='-10%' width='120%' height='120%'>${disp}<feGaussianBlur stdDeviation='1.4'/></filter>
    <filter id='wh' x='-10%' y='-10%' width='120%' height='120%'>${disp}<feGaussianBlur stdDeviation='26'/></filter>
    <filter id='w2' x='-10%' y='-10%' width='120%' height='120%'>
      <feTurbulence type='fractalNoise' baseFrequency='0.004' numOctaves='4' seed='13' result='t'/>
      <feDisplacementMap in='SourceGraphic' in2='t' scale='210' xChannelSelector='G' yChannelSelector='B'/>
      <feGaussianBlur stdDeviation='.5'/></filter>
    <filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.0008 0.0017' numOctaves='3' seed='3'/>
      <feColorMatrix values='0 0 0 0 ${cloud} 0 0 0 0 ${cloud} 0 0 0 0 ${cloud} 0 0 0 1.3 -.5'/></filter></defs>
    <rect width='${W}' height='${H}' fill='${bg}'/>
    <rect ${full} filter='url(#c)' opacity='${cloudOp}'/>
    <rect ${full} fill='url(#h)' filter='url(#wh)' opacity='${halo}'/>
    <rect ${full} fill='url(#a)' filter='url(#w)' opacity='${main}'/>
    <rect ${full} fill='url(#b)' filter='url(#w2)' opacity='${fine}'/></svg>`;
}
const VARIANTS = {
  light: { file: "marble-light.jpg", bg: "#f1eee8", vein: "#8f8a82", main: .42, fine: .30, halo: .16, cloud: .66, cloudOp: .20 }, // 白大理石
  dark: { file: "marble-dark.jpg", bg: "#151412", vein: "#d9c7a0", main: .34, fine: .20, halo: .12, cloud: .28, cloudOp: .50 },  // 黒大理石
};
async function draw(key) {
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(marble(VARIANTS[key]));
  await img.decode();
  const c = document.getElementById(key);
  c.width = W; c.height = H;
  c.getContext("2d").drawImage(img, 0, 0);
}
const ready = Promise.all(Object.keys(VARIANTS).map(draw));
document.getElementById("save").onclick = async () => {
  await ready;
  for (const [key, v] of Object.entries(VARIANTS)) {
    const blob = await new Promise((r) => document.getElementById(key).toBlob(r, "image/jpeg", 0.8));
    await fetch("http://127.0.0.1:8792/" + v.file, { method: "PUT", body: blob });
  }
  document.getElementById("msg").textContent = "保存しました";
};
</script>
