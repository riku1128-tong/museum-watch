<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美術館ウォッチ</title>
<meta name="description" content="全国の美術館の開館状況・開館時間・料金・開催中の展覧会を一覧で。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efece6; --surface: rgba(255, 255, 253, .82); --surface-solid: #fbfaf7; --ink: #23211e; --muted: #6f6a61;
  --line: #d9d3c7; --gold: #a07d45; --gold-soft: #d8c39a;
  --open: #3c6b58; --closed: #8a3b35; --unknown: #7a6420;
  --free-bg: rgba(233, 214, 166, .55); --free-ink: #6d5222;
  --warn: #d9a400; --danger: #c0392b;
  --shadow: 0 1px 2px rgba(40, 32, 20, .06), 0 8px 24px rgba(40, 32, 20, .06);
  --marble: url("marble-light.jpg");  /* scripts/marble_bake.html で生成 */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141312; --surface: rgba(28, 27, 25, .86); --surface-solid: #1c1b19; --ink: #ece7dd; --muted: #a59f93;
    --line: #3a3630; --gold: #c9a86a; --gold-soft: #6f5a36;
    --open: #8cc5aa; --closed: #e39a90; --unknown: #e3c97a;
    --free-bg: rgba(125, 98, 45, .38); --free-ink: #efd79f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    --marble: url("marble-dark.jpg");
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink); background: var(--marble) center / cover no-repeat fixed, var(--bg);
  font: 15px/1.7 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
}
a { color: var(--gold); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
.serif { font-family: "Shippori Mincho", "Yu Mincho", serif; }
.num { font-family: "Cormorant Garamond", "Shippori Mincho", serif; font-variant-numeric: lining-nums tabular-nums; }

header { max-width: 1160px; margin: 0 auto; padding: 36px 16px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.overline { font: 600 12px/1 "Cormorant Garamond", serif; letter-spacing: .42em; color: var(--gold); text-transform: uppercase; }
h1 { font: 700 clamp(26px, 5vw, 38px)/1.2 "Shippori Mincho", serif; margin: 10px 0 6px; letter-spacing: .08em; }
.sub { color: var(--muted); font-size: 13px; letter-spacing: .04em; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 42px; height: 42px;
  display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; box-shadow: var(--shadow); }
.icon-btn:hover { border-color: var(--gold); }
.rule { max-width: 1160px; margin: 0 auto; padding: 0 16px; }
.rule hr { border: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent); opacity: .6; margin: 14px 0 4px; }

main { max-width: 1160px; margin: 0 auto; padding: 0 16px 56px; }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: thin; }
.day { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 2px; padding: 8px 14px 6px;
  cursor: pointer; text-align: center; min-width: 70px; }
.day b { display: block; font: 600 17px/1.1 "Shippori Mincho", serif; }
.day small { display: block; color: var(--muted); font-size: 11px; line-height: 1.5; margin-top: 3px; }
.day.hol small, .day.sun small { color: var(--closed); }
.day.sat small { color: #4a6fa5; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] small { color: inherit; opacity: .75; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 4px 0 18px; }
.tabs { display: flex; border: 1px solid var(--line); background: var(--surface); border-radius: 2px; }
.tab { border: 0; background: transparent; padding: 7px 16px; cursor: pointer; letter-spacing: .06em; }
.tab + .tab { border-left: 1px solid var(--line); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
select, input[type="search"], input[type="text"] { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 2px; padding: 7px 10px; }
select:focus, input:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
input[type="search"] { flex: 1 1 200px; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; margin: -8px 0 14px; letter-spacing: .03em; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--gold-soft);
  padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: var(--shadow);
  user-select: none; }
.card.free { background: linear-gradient(var(--free-bg), var(--free-bg)), var(--surface-solid); border-top-color: var(--gold); }
.card:hover { border-color: var(--gold-soft); }
.top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.name { font: 700 18px/1.4 "Shippori Mincho", serif; letter-spacing: .03em; }
.name a { color: inherit; text-decoration: none; }
.name a:hover { text-decoration: underline; text-decoration-color: var(--gold); }
.meta { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
.status { flex: 0 0 auto; font-size: 11px; letter-spacing: .18em; padding: 3px 8px; border: 1px solid currentColor; white-space: nowrap; }
.s-open { color: var(--open); } .s-closed { color: var(--closed); } .s-unknown { color: var(--unknown); }
.freebadge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--free-ink);
  letter-spacing: .08em; }
.freebadge::before { content: ""; width: 18px; height: 1px; background: var(--gold); }
.facts { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; }
.hours { font-size: 30px; font-weight: 600; line-height: 1.1; }
.small { font-size: 12px; color: var(--muted); }
.price { font-size: 13px; }
.price .num { font-size: 18px; }
.reason { font-size: 13px; color: var(--muted); }
.warn-old { font-size: 12px; color: var(--unknown); }
ul.ex { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
ul.ex li { border-left: 1px solid var(--line); padding-left: 10px; }
ul.ex li.special { border-left: 2px solid var(--gold); }
.ex-title { font: 600 14.5px/1.5 "Shippori Mincho", serif; overflow-wrap: anywhere; }
.ex-title a { color: inherit; }
.ex-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.ex-sum { font-size: 12.5px; color: var(--muted); }
.alert { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
.alert svg { flex: 0 0 auto; }
.alert.w { color: #9a7400; } .alert.d { color: var(--danger); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .alert.w { color: var(--warn); } }
details.up summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.foot-actions { display: flex; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.chip:hover { border-color: var(--gold); }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #fff; }
.stamp { position: absolute; right: 14px; bottom: 44px; width: 58px; height: 58px; border: 1.5px solid var(--gold); border-radius: 50%;
  display: grid; place-items: center; color: var(--gold); font: 700 12px/1.1 "Shippori Mincho", serif; letter-spacing: .1em;
  transform: rotate(-12deg); opacity: .55; pointer-events: none; text-align: center; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; font-family: "Shippori Mincho", serif; }
.gone { margin-top: 32px; font-size: 12.5px; color: var(--muted); }
footer { max-width: 1160px; margin: 0 auto; padding: 0 16px 40px; font-size: 12px; color: var(--muted); }

dialog { border: 1px solid var(--gold-soft); border-top: 2px solid var(--gold); padding: 0; background: var(--surface-solid); color: var(--ink);
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
dialog::backdrop { background: rgba(20, 18, 15, .5); }
.dlg { padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { font: 700 20px/1.4 "Shippori Mincho", serif; margin: 0; letter-spacing: .04em; }
.dlg h3 { font: 600 13px/1 "Zen Kaku Gothic New", sans-serif; letter-spacing: .2em; color: var(--gold); margin: 8px 0 0; }
.dlg ul { margin: 0; padding-left: 1.2em; }
.dlg .row { display: flex; gap: 8px; flex-wrap: wrap; }
.dlg input[type="text"] { flex: 1 1 240px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 8px 16px; cursor: pointer; letter-spacing: .06em;
  text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { opacity: .88; }
.dlg .close { align-self: flex-end; }
.note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <div class="overline">Museum Watch</div>
    <h1>美術館ウォッチ</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button class="icon-btn" id="openSettings" aria-label="設定">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<div class="rule"><hr></div>
<main>
  <div class="days" id="days" role="toolbar" aria-label="日付"></div>
  <div class="controls">
    <div class="tabs" role="tablist" id="tabs"></div>
    <select id="pref" aria-label="都道府県"><option value="">全国</option></select>
    <select id="cat" aria-label="区分"><option value="">国立・公立・私立</option><option>国立</option><option>公立</option><option>私立</option></select>
    <select id="late" aria-label="閉館時刻">
      <option value="">閉館時刻</option><option value="17:30">17:30以降</option><option value="18:00">18:00以降</option>
      <option value="19:00">19:00以降</option><option value="20:00">20:00以降</option>
    </select>
    <select id="visit" aria-label="訪問">
      <option value="">訪問・未訪問</option><option value="no">今の会期でまだ行っていない館</option><option value="yes">今の会期で行った館</option>
    </select>
    <select id="sort" aria-label="並び順">
      <option value="close">閉館が遅い順</option><option value="ending">会期末が近い順</option>
      <option value="price">料金が安い順</option><option value="name">名前順</option>
    </select>
    <input type="search" id="q" placeholder="館名・展覧会名で検索" aria-label="検索">
  </div>
  <p class="hint">カードをダブルクリック（スマホは「行き方」）で行き方を表示します。</p>
  <div class="grid" id="grid"></div>
  <div class="gone" id="gone"></div>
</main>
<footer>
  情報は各館の公式サイトから自動で集めたもので、変更が反映されていないことがあります。お出かけ前に公式サイトでご確認ください。
  館の一覧: <a href="https://ja.wikipedia.org/wiki/美術館の一覧" target="_blank" rel="noopener">Wikipedia</a>（CC BY-SA 4.0）・Wikidata ／
  <a href="https://github.com/riku1128-tong/museum-watch" target="_blank" rel="noopener">GitHub</a>
</footer>

<dialog id="route" aria-labelledby="routeTitle"><div class="dlg" id="routeBody"></div></dialog>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="dlg">
    <h2 id="settingsTitle">設定</h2>
    <h3>出発地</h3>
    <div class="row">
      <input type="text" id="origin" placeholder="例: 渋谷駅、横浜市中区日本大通1" autocomplete="off">
      <button class="btn" id="saveOrigin">保存</button>
    </div>
    <p class="note">駅名か住所を登録すると、各館の「行き方」からGoogleマップの経路検索（電車）を開けます。
      ログイン中はアカウントに保存されるので、個人の住所より最寄駅の登録がおすすめです。</p>
    <h3>同期</h3>
    <div id="syncBox" class="note">読み込み中…</div>
    <h3>記録</h3>
    <div class="note" id="visitStats"></div>
    <button class="btn ghost close" id="closeSettings">閉じる</button>
  </div>
</dialog>

<script src="firebase-config.js" onerror="window.FIREBASE_CONFIG = null"></script>
<script>
const DATA = /*__DATA__*/null;
// 埋め込みデータは縮めてあるので元の形に戻す（展覧会は館ごとの一覧の番号で入っている）
for (const d of DATA.days) {
  for (const r of d.results) {
    const ex = DATA.museums[r.id].exhibitions;
    r.exhibitions = (r.exhibitions || []).map(([i, open, close]) => ({ ...ex[i], open, close }));
    r.upcoming = (r.upcoming || []).map((i) => ex[i]);
  }
  for (const id of DATA.pending) d.results.push({ id, status: "pending", exhibitions: [], upcoming: [] });
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (iso) => { const [, m, d] = iso.split("-"); return `${+m}/${+d}`; };
// 表示中の日と年が違う日付だけ年を付ける（例: 2027/9/24）
const mdy = (iso, ref) => iso.slice(0, 4) === ref.slice(0, 4) ? md(iso) : `${iso.slice(0, 4)}/${md(iso)}`;
const yen = (n) => n === 0 ? "無料" : `<span class="num">¥${n.toLocaleString("ja-JP")}</span>`;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("mw:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("mw:" + k, JSON.stringify(v)); } catch {} },
};

// ユーザーデータ（訪問記録・出発地）。ログイン中は Firebase と同期する（下の module script）
// visits: { 館id: [{ date: 訪問日, until: その日に開催中だった展覧会の会期末 | null }] }
const user = Object.assign({ visits: {}, origin: "", updatedAt: 0 }, store.get("user") || {});

// 訪問した日に開催中だった展覧会が終わる日。企画展があれば企画展のうち最も早く終わる日、なければ常設展など
function untilFor(id, date) {
  const running = (DATA.museums[id]?.exhibitions || []).filter((e) => e.start <= date && date <= e.end);
  const pick = running.some((e) => e.kind === "special") ? running.filter((e) => e.kind === "special") : running;
  return pick.length ? pick.map((e) => e.end).sort()[0] : null;
}
const visitsOf = (id) => user.visits[id] || [];
// その日の時点で有効な訪問（会期がまだ終わっていない訪問）。無ければ未訪問扱い
const currentVisit = (id, date) =>
  visitsOf(id).filter((v) => v.date <= date && (v.until == null || v.until >= date)).sort((a, b) => b.date.localeCompare(a.date))[0];
// 旧形式（visited: {id: 日付}）からの移行
if (user.visited) {
  for (const [id, date] of Object.entries(user.visited)) user.visits[id] = [{ date, until: untilFor(id, date) }];
  delete user.visited;
  store.set("user", user);
}
function saveUser(changed = true) {
  if (changed) user.updatedAt = Date.now();
  store.set("user", user);
  window.mwSync?.push(user);
}
window.mwUser = {
  get: () => user,
  replace(next) { Object.assign(user, next); store.set("user", user); render(); renderSettings(); },
};

const TABS = [["open", "開館"], ["closed", "休館"], ["unknown", "不明"], ["pending", "情報準備中"]];
// ページを開いた日（JST）を「今日」にする。生成日から日がたっていれば過去の日は出さない
const todayJst = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const first = DATA.days.findIndex((d) => d.date >= todayJst);
DATA.days = DATA.days.slice(first === -1 ? DATA.days.length - 1 : first);
const state = Object.assign({ day: 0, tab: "open", pref: "", cat: "", late: "", visit: "", sort: "close", q: "" },
  store.get("state") || {}, { day: 0 });

const prefs = Object.values(DATA.regions).flat();
$("sub").textContent = `${prefs.length > 2 ? "全国" : prefs.join("・")} ${Object.keys(DATA.museums).length} 館 ・ 更新 ${DATA.generated_at.slice(0, 16).replace("T", " ")}`;
// 都道府県の絞り込みは地方ごとにまとめる（「関東すべて」のような地方単位の選択もできる）
for (const [region, ps] of Object.entries(DATA.regions)) {
  if (!ps.length) continue;
  const g = document.createElement("optgroup"); g.label = region;
  g.append(new Option(`${region}すべて`, "region:" + region), ...ps.map((p) => new Option(p, p)));
  $("pref").append(g);
}

const ICON_WARN = `<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21z" fill="#f2c200" stroke="#8a6a00" stroke-width="1.2" stroke-linejoin="round"/><path d="M12 9v5.5" stroke="#3a2c00" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.3" fill="#3a2c00"/></svg>`;
const ICON_LAST = `<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21z" fill="#d93025" stroke="#8c1d15" stroke-width="1.2" stroke-linejoin="round"/><path d="M12 9v5.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.3" fill="#fff"/></svg>`;

function renderDays() {
  $("days").innerHTML = DATA.days.map((d, i) => {
    const cls = ["day", d.holiday ? "hol" : "", d.weekday === "日" ? "sun" : "", d.weekday === "土" ? "sat" : ""].join(" ");
    const label = d.date === todayJst ? "今日" : i === 1 && DATA.days[0].date === todayJst ? "明日" : md(d.date);
    const n = d.results.filter((r) => r.status === "open").length;
    return `<button class="${cls}" aria-pressed="${i === state.day}" data-i="${i}" title="${esc(d.holiday || "")}">
      <b>${label}</b><small>${label !== md(d.date) ? md(d.date) + " " : ""}${d.weekday}${d.holiday ? "・祝" : ""} ・ ${n}館</small></button>`;
  }).join("");
}
function renderTabs(results) {
  const n = (k) => results.filter((r) => r.status === k).length;
  if (["unknown", "pending"].includes(state.tab) && !n(state.tab)) state.tab = "open";
  $("tabs").innerHTML = TABS.filter(([k]) => !["unknown", "pending"].includes(k) || n(k)).map(([k, label]) =>
    `<button class="tab" role="tab" aria-selected="${state.tab === k}" data-k="${k}">${label} <span class="num">${n(k)}</span></button>`).join("");
}
// その日の無料が、この展覧会に当てはまるか（全館無料、常設展のみ無料、一部無料の対象）
function isFreeEx(free, e) {
  if (!free) return false;
  if (free.scope === "all") return true;
  if (free.scope === "collection") return e.kind === "collection";
  return (free.targets || []).some((t) => e.title.includes(t));
}
function exHtml(e, date, freeToday = false) {
  const left = Math.round((new Date(e.end) - new Date(date)) / 864e5);
  const alert = left === 0 ? `<span class="alert d" title="本日が最終日">${ICON_LAST}本日最終日</span>`
    : left <= 7 ? `<span class="alert w" title="会期終了まであと${left}日">${ICON_WARN}あと${left}日</span>` : "";
  const title = e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title);
  const own = e.open ? `<span class="num">${e.open}–${e.close}</span>` : "";
  const price = freeToday ? `<span class="freebadge">この日は無料</span>`
    : e.price != null ? `<span>一般 ${yen(e.price)}</span>` : e.admission ? `<span>${esc(e.admission)}</span>` : "";
  return `<li class="${e.kind === "special" ? "special" : ""}"><div class="ex-title">${title}</div>
    <div class="ex-meta"><span class="num">${mdy(e.start, date)} – ${mdy(e.end, date)}</span>${alert}${own}${price}</div>
    ${e.summary ? `<div class="ex-sum">${esc(e.summary)}</div>` : ""}</li>`;
}
function card(r, date) {
  const m = DATA.museums[r.id];
  const cv = currentVisit(r.id, date);
  const visited = !!cv, count = visitsOf(r.id).length;
  const status = { open: ["s-open", "開館"], closed: ["s-closed", "休館"], unknown: ["s-unknown", "不明"],
                   pending: ["s-unknown", "準備中"] }[r.status];
  const freeLabel = r.free && { all: "無料開放日", collection: "常設展 無料開放日",
    partial: `一部無料開放日（${(r.free.targets || []).map((t) => esc(t)).join("・")}）` }[r.free.scope];
  const free = r.free ? `<div class="freebadge">${freeLabel}${r.free.reason ? "・" + esc(r.free.reason) : ""}</div>` : "";
  const hours = r.status === "open" ? `<span class="hours num">${r.open ? `${r.open} – ${r.close}` : "時間不明"}</span>
      ${r.last_entry ? `<span class="small">最終入館 <span class="num">${r.last_entry}</span></span>` : ""}` : "";
  const price = m.price != null ? `<span class="price">大人 ${yen(m.price)}</span>` : "";
  const facts = hours || price ? `<div class="facts">${hours}${price}</div>` : "";
  const reason = r.status === "pending"
    ? `<div class="reason">開館時間と展覧会の情報は、毎週の巡回で順番に集めています。${m.url ? `今は<a href="${esc(m.url)}" target="_blank" rel="noopener">公式サイト</a>でご確認ください。` : ""}</div>`
    : r.reason ? `<div class="reason">${esc(r.reason)}</div>` : "";
  const old = r.needs_check ? `<div class="warn-old">情報が古いか不確かです。公式サイトでご確認ください</div>` : "";
  const ex = r.exhibitions.length ? `<ul class="ex">${r.exhibitions.map((e) => exHtml(e, date, isFreeEx(r.free, e))).join("")}</ul>` : "";
  const up = r.upcoming.length ? `<details class="up"><summary>まもなく開始 ${r.upcoming.length}件</summary><ul class="ex">${
    r.upcoming.map((e) => `<li><div class="ex-title">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}</div><div class="ex-meta num">${mdy(e.start, date)} – ${mdy(e.end, date)}</div></li>`).join("")}</ul></details>` : "";
  return `<article class="card${r.free && r.status === "open" ? " free" : ""}" data-id="${r.id}">
    <div class="top"><div><div class="name">${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)}</a>` : esc(m.name)}</div>
    <div class="meta">${esc(m.prefecture)}${m.municipality && m.municipality !== m.prefecture ? " " + esc(m.municipality) : ""} ・ ${esc(m.category)}</div></div>
    <span class="status ${status[0]}">${status[1]}</span></div>
    ${free}${facts}${reason}${ex}${up}${old}
    ${visited ? `<div class="stamp" title="${cv.until ? `訪問時の展覧会は ${mdy(cv.until, date)} まで` : ""}">訪問<br>済</div>` : ""}
    <div class="foot"><span>${m.checked_at ? `確認 <span class="num">${md(m.checked_at.slice(0, 10))} ${m.checked_at.slice(11, 16)}</span>` : "未取得"}${
      count ? ` ・ 訪問 <span class="num">${count}</span> 回` : ""}</span>
      <span class="foot-actions">
        <button class="chip" data-act="route">行き方</button>
        <button class="chip" data-act="visit" aria-pressed="${visited}">${visited ? "行った ✓" : "行った"}</button>
      </span></div></article>`;
}
function render() {
  store.set("state", state);
  const day = DATA.days[state.day];
  renderDays();
  const q = state.q.trim().toLowerCase();
  const base = day.results.filter((r) => {
    const m = DATA.museums[r.id];
    if (state.pref && (state.pref.startsWith("region:") ? !DATA.regions[state.pref.slice(7)]?.includes(m.prefecture)
                                                         : m.prefecture !== state.pref)) return false;
    if (state.cat && m.category !== state.cat) return false;
    if (state.visit === "yes" && !currentVisit(r.id, day.date)) return false;
    if (state.visit === "no" && currentVisit(r.id, day.date)) return false;
    if (q && !(m.name.toLowerCase().includes(q) || r.exhibitions.some((e) => e.title.toLowerCase().includes(q)))) return false;
    return true;
  });
  renderTabs(base);
  let list = base.filter((r) => r.status === state.tab);
  if (state.late) list = list.filter((r) => r.close && r.close >= state.late);
  const name = (r) => DATA.museums[r.id].name;
  const endKey = (r) => r.exhibitions.map((e) => e.end).sort()[0] || "9999";
  const priceKey = (r) => (r.free?.scope === "all" ? 0 : DATA.museums[r.id].price ?? 1e9);
  const sorters = {
    close: (a, b) => (b.close || "").localeCompare(a.close || "") || name(a).localeCompare(name(b), "ja"),
    ending: (a, b) => endKey(a).localeCompare(endKey(b)),
    price: (a, b) => priceKey(a) - priceKey(b),
    name: (a, b) => name(a).localeCompare(name(b), "ja"),
  };
  list.sort(sorters[state.sort]);
  $("grid").innerHTML = list.length ? list.map((r) => card(r, day.date)).join("") : `<div class="empty">該当する美術館はありません</div>`;
  $("gone").textContent = DATA.gone.length ? `閉館済みのため除外: ${DATA.gone.map((g) => g.name).join("、")}` : "";
}

// 行き方
function openRoute(id) {
  const m = DATA.museums[id];
  const dest = `${m.name} ${m.address || m.prefecture}`;
  const gm = (params) => "https://www.google.com/maps/dir/?api=1&travelmode=transit&" + new URLSearchParams(params);
  const place = "https://www.google.com/maps/search/?api=1&" + new URLSearchParams({ query: dest });
  const access = m.access?.length ? `<ul>${m.access.map((a) => `<li>${a.lines ? esc(a.lines) + " " : ""}「${esc(a.station)}」駅${
    a.exit ? " " + esc(a.exit) : ""}${a.walk_min != null ? ` から徒歩 <span class="num">${a.walk_min}</span> 分` : ""}${a.note ? `（${esc(a.note)}）` : ""}</li>`).join("")}</ul>`
    : `<p class="note">最寄駅の情報はまだ集めていません。下のGoogleマップでご確認ください。</p>`;
  const from = user.origin
    ? `<a class="btn" href="${gm({ origin: user.origin, destination: dest })}" target="_blank" rel="noopener">「${esc(user.origin)}」からの経路（電車）</a>`
    : `<p class="note">設定で出発地（駅名・住所）を登録すると、そこからの経路をすぐに開けます。</p>
       <button class="btn ghost" data-act="settings">出発地を登録する</button>`;
  $("routeBody").innerHTML = `<h2 id="routeTitle">${esc(m.name)}</h2>
    ${m.address ? `<div class="note">${esc(m.address)}</div>` : ""}
    <h3>最寄駅</h3>${access}
    <h3>出発地から</h3><div class="row">${from}<a class="btn ghost" href="${place}" target="_blank" rel="noopener">地図で見る</a></div>
    <button class="btn ghost close" data-act="close">閉じる</button>`;
  $("route").showModal();
}
$("route").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "close" || e.target === $("route")) $("route").close();
  if (act === "settings") { $("route").close(); openSettings(); }
});

// 設定
function renderSettings() {
  $("origin").value = user.origin || "";
  const ids = Object.keys(user.visits).filter((id) => DATA.museums[id] && visitsOf(id).length);
  const now = ids.filter((id) => currentVisit(id, todayJst)).length;
  const total = ids.reduce((n, id) => n + visitsOf(id).length, 0);
  $("visitStats").textContent = `今の会期で行った館 ${now} ・ これまでに行った館 ${ids.length} / ${Object.keys(DATA.museums).length} ・ 訪問 ${total} 回`;
  window.mwSync?.renderBox?.();
  if (!window.mwSync) $("syncBox").innerHTML = window.FIREBASE_CONFIG === null || !window.FIREBASE_CONFIG
    ? "同期は準備中です。今はこの端末のブラウザにだけ保存されます。" : "同期を読み込み中…";
}
function openSettings() { renderSettings(); $("settings").showModal(); }
$("openSettings").addEventListener("click", openSettings);
$("closeSettings").addEventListener("click", () => $("settings").close());
$("settings").addEventListener("click", (e) => { if (e.target === $("settings")) $("settings").close(); });
$("saveOrigin").addEventListener("click", () => { user.origin = $("origin").value.trim(); saveUser(); $("settings").close(); });

// カード操作
$("grid").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const id = btn.closest(".card").dataset.id;
  if (btn.dataset.act === "route") openRoute(id);
  if (btn.dataset.act === "visit") {
    // 今の会期で訪問済みなら、その記録を取り消す。未訪問なら今日の訪問を記録する
    const cv = currentVisit(id, todayJst);
    const list = visitsOf(id).filter((v) => v !== cv);
    if (!cv) list.push({ date: todayJst, until: untilFor(id, todayJst) });
    if (list.length) user.visits[id] = list; else delete user.visits[id];
    saveUser(); render();
  }
});
$("grid").addEventListener("dblclick", (e) => {
  if (e.target.closest("a, button")) return;
  const c = e.target.closest(".card"); if (c) { window.getSelection()?.removeAllRanges(); openRoute(c.dataset.id); }
});
$("days").addEventListener("click", (e) => { const b = e.target.closest(".day"); if (b) { state.day = +b.dataset.i; render(); } });
$("tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) { state.tab = b.dataset.k; render(); } });
for (const id of ["pref", "cat", "late", "visit", "sort"]) { $(id).value = state[id]; $(id).addEventListener("change", (e) => { state[id] = e.target.value; render(); }); }
$("q").value = state.q; $("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
render();
</script>

<script type="module">
// Firebase（Google ログイン + Firestore）で「行った館」と出発地を端末間で同期する。
// docs/firebase-config.js が無ければ何もしない（端末内保存のみ）。
const cfg = window.FIREBASE_CONFIG;
if (cfg) {
  const V = "10.12.2";
  const [{ initializeApp }, auth, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const app = initializeApp(cfg);
  const a = auth.getAuth(app);
  const db = fs.getFirestore(app);
  const box = document.getElementById("syncBox");
  let current = null, timer = null;

  const docRef = (uid) => fs.doc(db, "users", uid);
  const renderBox = () => {
    box.innerHTML = current
      ? `<div>${current.displayName || current.email} でログイン中。行った館と出発地を同期しています。</div>
         <div class="row" style="margin-top:8px"><button class="btn ghost" id="logout">ログアウト</button></div>`
      : `<div>Googleアカウントでログインすると、スマホとPCで「行った館」と出発地を同期できます。</div>
         <div class="row" style="margin-top:8px"><button class="btn" id="login">Googleでログイン</button></div>`;
    document.getElementById("login")?.addEventListener("click", () =>
      auth.signInWithPopup(a, new auth.GoogleAuthProvider()).catch((e) => alert("ログインできませんでした: " + e.message)));
    document.getElementById("logout")?.addEventListener("click", () => auth.signOut(a));
  };
  window.mwSync = {
    renderBox,
    push(user) {
      if (!current) return;
      clearTimeout(timer);
      timer = setTimeout(() => fs.setDoc(docRef(current.uid), user).catch(console.error), 600);
    },
  };
  auth.onAuthStateChanged(a, async (u) => {
    current = u; renderBox();
    if (!u) return;
    const local = window.mwUser.get();
    const snap = await fs.getDoc(docRef(u.uid));
    const remote = snap.exists() ? snap.data() : { visits: {}, origin: "", updatedAt: 0 };
    // 訪問記録は館ごとに訪問日で和集合をとる。出発地は新しく更新した方を採る
    const visits = {};
    for (const src of [remote.visits || {}, local.visits || {}])
      for (const [id, list] of Object.entries(src))
        for (const v of list) if (!(visits[id] ||= []).some((x) => x.date === v.date)) visits[id].push(v);
    const newer = (local.updatedAt || 0) > (remote.updatedAt || 0) ? local : remote;
    const merged = { visits, origin: newer.origin || "", updatedAt: Date.now() };
    window.mwUser.replace(merged);
    await fs.setDoc(docRef(u.uid), merged);
  });
}
</script>
